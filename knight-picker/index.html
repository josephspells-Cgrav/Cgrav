<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Knight Construction — photo picker</title>
<style>
:root{--bg:#0f1215;--card:#171b1f;--ink:#eef1f4;--mut:#939ca5;--line:#242b31;--blue:#0a84ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:30;background:rgba(15,18,21,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 14px}
h1{font-size:17px;letter-spacing:-.01em}
.note{color:var(--mut);font-size:12.5px;margin-top:3px}
.note b{color:#ffd60a;font-weight:700}
.bar{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.fbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.fbtn.on{background:var(--blue);border-color:var(--blue)}
.savebar{margin-left:auto;font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
.savebar .n{color:var(--blue);font-size:15px}
.feed{max-width:1780px;margin:0 auto;padding:12px 8px 90px;display:flex;flex-wrap:wrap;gap:6px;--rowh:430px}
.feed::after{content:"";flex-grow:1000000}
.ph{position:relative;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:1px var(--rowh);flex-basis:calc(var(--ar)*var(--rowh));min-width:180px}
.ph img{width:100%;height:auto;display:block;cursor:zoom-in}
@media(max-width:900px){.feed{--rowh:300px;gap:5px}}
@media(max-width:560px){.feed{--rowh:240px;gap:4px}}
.ph .meta{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;pointer-events:none}
.ck{position:absolute;top:8px;right:8px;width:42px;height:42px;border-radius:50%;border:2.5px solid rgba(255,255,255,.9);background:rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
.ck svg{width:24px;height:24px;opacity:0;transition:opacity .12s}
.ph.sel .ck{background:var(--blue);border-color:var(--blue)}
.ph.sel .ck svg{opacity:1}
.ph.sel{outline:3px solid var(--blue);outline-offset:-3px}
.ex{position:absolute;top:8px;right:58px;width:42px;height:42px;border-radius:50%;border:2.5px solid rgba(255,255,255,.55);background:rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.hide{display:none}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(5,7,9,.96);z-index:50;display:none;flex-direction:column}
.lb.show{display:flex}
.lb .img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb .ctr{display:flex;gap:10px;justify-content:center;align-items:center;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.lbtn{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;font-size:14.5px}
.lbtn.pick.on{background:var(--blue);border-color:var(--blue)}
.lb .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:20px;cursor:pointer}
.lb .count{position:absolute;top:20px;left:16px;color:var(--mut);font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(16px);bottom:24px;background:#000;color:#fff;font-size:13.5px;font-weight:700;border-radius:11px;padding:10px 16px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<header>
  <h1>Knight Construction — pick photos for the site</h1>
  <div class="note">Tap the circle to pick one (blue = picked, saves instantly). Tap the photo to zoom. <b>Skip photos showing other companies' trucks or signs.</b></div>
  <div class="bar">
    <button class="fbtn on" data-f="all">All</button>
    <button class="fbtn" data-f="picked">Picked</button>
    <button class="fbtn" data-f="unpicked">Not picked</button>
    <span class="savebar"><span class="n" id="nsel">0</span> picked · <span id="save">Loading…</span></span>
  </div>
</header>
<div class="feed" id="feed"></div>

<div class="lb" id="lb">
  <button class="x" onclick="closeLb()">✕</button>
  <div class="count" id="lbcount"></div>
  <div class="img"><img id="lbimg" alt=""></div>
  <div class="ctr">
    <button class="lbtn" onclick="lbNav(-1)">‹ Prev</button>
    <button class="lbtn pick" id="lbpick"></button>
    <button class="lbtn" onclick="lbNav(1)">Next ›</button>
  </div>
</div>
<div class="toast" id="toast"></div>
