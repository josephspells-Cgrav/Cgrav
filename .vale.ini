# Vale — prose linting for King Maker work product.
# Binary: C:/Users/josep/AppData/Roaming/npm/node_modules/@vvago/vale/bin/vale.exe
#         (npm @vvago/vale; `vale.cmd` shim in AppData/Roaming/npm for PowerShell)
# Refresh packages after editing Packages=:  vale sync
#
# WHY THIS EXISTS: the anti-tell rules were previously discipline-only. A linter
# catches what discipline forgets. Same logic as verify-gate / skills-gate —
# a mechanical check beats an intention.

StylesPath = .vale-styles
MinAlertLevel = suggestion
Vocab = KingMaker

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.26.0/ai-tells.zip

# ── Default: prose we author (vault notes, work orders, reports, drafts) ──
[*.{md,txt}]
BasedOnStyles = ai-tells

# ── 🔴 CONTRACTS AND LEGAL: NO anti-slop rules. ───────────────────────────
# Deliberately empty, not an oversight. Legal drafting legitimately uses
# passive voice, long sentences, defined-term repetition, and formal register
# — every one of which these rules flag. Running a humanizer over the Mabrey
# terms would actively make them worse and could change their meaning.
# Contracts get read by a human, never by this.
[{contracts,legal,terms}/**]
BasedOnStyles =

# ── Site copy: lint the RENDERED output, not the source. ──────────────────
# Website copy lives in .ts/.tsx string literals (lib/content-*.ts, lib/data.ts,
# lib/articles/*.ts), so pointing Vale at source files lints the code too and
# drowns real hits in noise. The working technique is to lint the BUILT HTML or
# a curl of the live page — that also lints what the visitor actually reads,
# including anything a component injects.
#   vale --ext=.html <(curl -s https://mabreyroofing.com/)
[*.html]
BasedOnStyles = ai-tells
