<style>
:root{--bg:#ffffff;--card:#f4f6fb;--ink:#14213d;--mut:#51607a;--line:#e2e8f0;--blue:#1a489a;--mab-navy:#0e2140;--mab-body:#33415c;--mab-tint:#eef2fb;--mab-brandhi:#14356f;--mab-brandsoft:#eaf0fb;--mab-red:#c02026;--mab-font-display:'Newsreader',Georgia,ui-serif,serif;--mab-font-sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif}
header{padding:16px 14px;border-bottom:1px solid var(--line)}
h1{font-size:19px;letter-spacing:-.01em}
.note{color:var(--mut);font-size:12.5px;margin-top:3px}
.feed{max-width:1780px;margin:0 auto;padding:12px 8px 60px;display:flex;flex-wrap:wrap;gap:6px;--rowh:430px}
.feed::after{content:"";flex-grow:1000000}
.ph{position:relative;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:1px var(--rowh);min-width:180px}
.ph img{width:100%;height:auto;display:block;cursor:zoom-in}
@media(max-width:900px){.feed{--rowh:300px;gap:5px}}
@media(max-width:560px){.feed{--rowh:240px;gap:4px}}
.lb{position:fixed;inset:0;background:rgba(5,7,9,.97);z-index:50;display:none;flex-direction:column}
.lb.show{display:flex}
.lb .img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb .ctr{display:flex;gap:10px;justify-content:center;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.lbtn{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;font-size:14.5px}
.lb .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:20px;cursor:pointer}
.lb .count{position:absolute;top:20px;left:16px;color:var(--mut);font-size:13px;font-weight:700}
</style>

<style id="mabrey-brand-css">

}
