<style>
:root{--bg:#ffffff;--card:#f4f6fb;--ink:#14213d;--mut:#51607a;--line:#e2e8f0;--blue:#1a489a;--mab-navy:#0e2140;--mab-body:#33415c;--mab-tint:#eef2fb;--mab-brandhi:#14356f;--mab-brandsoft:#eaf0fb;--mab-red:#c02026;--mab-font-display:'Newsreader',Georgia,ui-serif,serif;--mab-font-sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:30;background:rgba(15,18,21,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 14px}
h1{font-size:17px;letter-spacing:-.01em}
.feed{max-width:1780px;margin:0 auto;padding:12px 8px 90px;display:flex;flex-wrap:wrap;gap:6px;--rowh:430px}
.feed::after{content:"";flex-grow:1000000}
.ph{position:relative;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line);flex-basis:calc(var(--ar)*var(--rowh));min-width:180px}
.ph img{width:100%;height:auto;display:block;cursor:zoom-in}
@media(max-width:900px){.feed{--rowh:300px;gap:5px}}
.lb{position:fixed;inset:0;background:rgba(5,7,9,.96);z-index:50;display:none;flex-direction:column}
.lb.show{display:flex}
</style>
<!-- MABREY-BRAND-CSS:BEGIN -->
<style id="mabrey-brand-css">
body{background:var(--bg,#ffffff);color:var(--mab-body,#33415c);font-family:var(--mab-font-sans,system-ui,sans-serif)}
::selection{background:rgba(26,72,154,.16);color:var(--ink,#14213d)}
:focus-visible{outline:2px solid var(--blue,#1a489a);outline-offset:2px;border-radius:2px}
.mab-strip{background:var(--mab-navy,#0e2140)}
.mab-strip-inner{max-width:1280px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;justify-content:center;column-gap:12px;row-gap:4px;flex-wrap:wrap;font-family:var(--mab-font-sans,sans-serif);font-size:13px;font-weight:600;line-height:1.35;color:#fff;text-align:center}
.mab-dot{width:8px;height:8px;border-radius:50%;background:#9d2e34;flex:none}
.mab-strip-sep{color:var(--mut,#51607a)}
.mab-strip-call{color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.mab-strip-call:hover{opacity:.88}
.mab-strip-call svg{width:13px;height:13px;flex:none}
header.mab-header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line,#e2e8f0);padding:0}
.mab-bar-row{max-width:1280px;margin:0 auto;padding:0 20px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mab-lockup{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none;min-width:0}
.mab-mark{display:block;width:36px;height:36px;border-radius:6px}
.mab-name{display:block;font-family:var(--mab-font-display,Georgia,serif);font-weight:600;letter-spacing:-.01em;font-size:17px;line-height:1;color:var(--ink,#14213d);white-space:nowrap}
.mab-sub{display:block;font-family:var(--mab-font-sans,sans-serif);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut,#51607a);margin-top:4px}
.mab-right{display:flex;align-items:center;gap:14px;flex:none}
.mab-vet{display:none;align-items:center;gap:6px;font-family:var(--mab-font-sans,sans-serif);font-size:13px;font-weight:600;color:var(--ink,#14213d);white-space:nowrap}
.mab-stars{color:var(--blue,#1a489a);letter-spacing:1px;font-size:12px}
.mab-cta{display:inline-flex;align-items:center;gap:8px;background:var(--blue,#1a489a);color:#fff;border-radius:6px;padding:10px 16px;font-family:var(--mab-font-sans,sans-serif);font-size:15px;font-weight:600;line-height:1;text-decoration:none;white-space:nowrap;transition:background .15s}
.mab-cta:hover{background:var(--mab-brandhi,#14356f)}
.mab-cta svg{width:16px;height:16px;flex:none}
.mab-header .bar{max-width:1280px;margin:0 auto;padding:0 20px 12px}
@media(min-width:640px){.mab-bar-row{padding:0 32px}.mab-strip-inner{padding:8px 32px}.mab-header .bar{padding:0 32px 12px}}
@media(min-width:1100px){.mab-vet{display:inline-flex}}
@media(max-width:520px){.mab-cta-num{display:none}.mab-cta{padding:10px 12px}}
.fbtn.on{color:#fff}
.lbtn.pick.on{color:#fff}
.note b{color:var(--mab-brandhi,#14356f)}
</style>
<!-- MABREY-BRAND-CSS:END -->
